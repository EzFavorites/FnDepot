name: 构建 ClawBot Gateway

on:
  push:
    tags: ['clawbot-gateway-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则读取 manifest 默认版本）'
        required: false
        default: ''
      create_release:
        description: '创建 GitHub Release'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      update_fnpack:
        description: '更新 fnpack.json 版本信息'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    name: 构建 ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            fnpack_platform: x86
            go_arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            fnpack_platform: arm
            go_arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: clawbot-gateway

    steps:
      # ========== 检出 FnDepot 仓库 ==========
      - name: 检出代码
        uses: actions/checkout@v4

      # ========== 设置 Go 环境 ==========
      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # ========== 设置 Node.js 环境 ==========
      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ========== 确定版本号 ==========
      - name: 确定版本号
        id: version
        run: |
          MANIFEST_VER=$(grep '^version' manifest | awk -F'=' '{print $2}' | tr -d ' ')
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/clawbot-gateway-v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#clawbot-gateway-v}"
          else
            VERSION="${MANIFEST_VER}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本号: $VERSION"

      # ========== 克隆 clawbot-gateway 源码 ==========
      - name: 克隆源码仓库
        run: |
          git clone --depth=1 -b main https://github.com/EzFavorites/clawbot-gateway.git /tmp/clawbot-src
          echo "源码克隆完成"

      # ========== 构建前端 ==========
      - name: 构建前端
        run: |
          cd /tmp/clawbot-src/web
          npm install --include=dev
          npm run build
          echo "前端构建完成"

      # ========== 编译 Go 后端 ==========
      - name: 编译 Go 后端
        run: |
          cd /tmp/clawbot-src
          GOOS=linux GOARCH=${{ matrix.go_arch }} CGO_ENABLED=0 go build \
            -ldflags="-X 'clawbot-gateway/internal/version.Version=${{ steps.version.outputs.version }}' -X 'clawbot-gateway/internal/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)' -X 'clawbot-gateway/internal/version.BuildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ')'" \
            -o /tmp/clawbot-src/clawbot-gateway .
          echo "Go 后端编译完成: $(du -h /tmp/clawbot-src/clawbot-gateway | cut -f1)"

      # ========== 组装应用文件 ==========
      - name: 组装应用文件
        run: |
          # 复制后端二进制
          mkdir -p app/server
          cp /tmp/clawbot-src/clawbot-gateway app/server/clawbot-gateway
          chmod +x app/server/clawbot-gateway

          # 复制前端文件
          rm -rf app/server/web
          mkdir -p app/server/web
          cp -r /tmp/clawbot-src/web/dist app/server/web/

          # 复制桌面图标
          mkdir -p app/ui/images
          cp ICON.PNG app/ui/images/icon_64.png
          cp ICON_256.PNG app/ui/images/icon_256.png

          echo "应用文件组装完成"
          ls -la app/server/

      # ========== 更新 manifest ==========
      - name: 更新 manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.fnpack_platform }}"
          sed -i "s/^version.*/version = ${VERSION}/" manifest
          sed -i "s/^platform.*/platform = ${PLATFORM}/" manifest
          echo "=== manifest ===" && cat manifest

      # ========== 修复脚本权限 ==========
      - name: 修复脚本权限
        run: |
          for f in cmd/main cmd/install_init cmd/install_callback cmd/uninstall_init cmd/uninstall_callback cmd/upgrade_init cmd/upgrade_callback cmd/config_init cmd/config_callback; do
            [ -f "$f" ] && sed -i 's/\r$//' "$f" && chmod +x "$f"
          done

      # ========== 使用 fnpack 打包 FPK ==========
      - name: 下载 fnpack 并打包
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-arm64
          else
            curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64
          fi
          chmod +x /tmp/fnpack
          /tmp/fnpack build --directory .
          FPKN=$(ls *.fpk) && mv "$FPKN" clawbot-gateway-${{ matrix.arch == 'x86_64' && 'X86' || 'ARM' }}.fpk
          echo "构建完成: $(ls -lh *.fpk)"

      # ========== 上传产物 ==========
      - name: 上传 FPK
        uses: actions/upload-artifact@v4
        with:
          name: clawbot-gateway-${{ matrix.arch }}
          path: clawbot-gateway/clawbot-gateway-*.fpk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/clawbot-gateway-v') || github.event.inputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有 FPK
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: 删除旧版本 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || echo "")
          echo "$RELEASES" | while read -r tag; do
            case "$tag" in clawbot-gateway-*) gh release delete "${tag}" --yes --cleanup-tag 2>/dev/null || true;; esac
          done

      - name: 确定构建信息
        id: info
        run: |
          MANIFEST_VER=$(grep '^version' clawbot-gateway/manifest | awk -F'=' '{print $2}' | tr -d ' ')
          if [[ "${{ github.ref }}" == refs/tags/clawbot-gateway-v* ]]; then
            TAG="${{ github.ref_name }}" && VERSION="${TAG#clawbot-gateway-v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="clawbot-gateway-v${{ github.event.inputs.version }}" && VERSION="${{ github.event.inputs.version }}"
          else
            TAG="clawbot-gateway-v${MANIFEST_VER}" && VERSION="${MANIFEST_VER}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_time=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M CST')" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "ClawBot Gateway ${{ steps.info.outputs.version }}"
          files: ./artifacts/**/*.fpk
          generate_release_notes: false
          body: |
            ## ClawBot Gateway v${{ steps.info.outputs.version }}

            ClawBot Gateway 是一个微信 iLink 消息网关，支持多后端适配、智能路由和虚拟 Bot 代理。

            ### 功能特性

            - 微信多账号管理，扫码登录即可接入
            - 智能消息路由：按规则分发到不同后端
            - 后端适配器：OpenAI、Echo 调试等
            - 虚拟 Bot 代理：提供标准 iLink 服务端 API
            - 文件中转与通知通道
            - 可视化 Web 管理面板 (PWA)

            ### 下载

            | 文件 | 架构 | 适用设备 |
            |------|------|----------|
            | `clawbot-gateway-X86.fpk` | x86_64 | Intel/AMD NAS |
            | `clawbot-gateway-ARM.fpk` | arm64 | ARM NAS |

            ---
            构建时间: ${{ steps.info.outputs.build_time }}

      - name: 更新 README 编译时间
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update-readme-time.py clawbot-gateway "${{ steps.info.outputs.build_time }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && echo "无变更" && exit 0
          git add README.md
          git commit -m "docs: 更新 ClawBot Gateway 编译时间"
          git push origin main

      - name: 更新 fnpack.json 版本信息
        if: github.event.inputs.update_fnpack == 'true'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/update-fnpack.py clawbot-gateway "${{ steps.info.outputs.tag }}" "${{ github.repository }}"
          git diff --quiet fnpack.json && echo "fnpack.json 无变更" && exit 0
          git add fnpack.json
          git commit -m "docs: 更新 ClawBot Gateway 版本信息到 fnpack.json"
          git push origin main